<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Contador de Passos</title>
<style>
  :root{
    --bg:#0e1912;
    --panel:#132419;
    --panel-2:#1a3123;
    --accent:#3ddc84;
    --accent-dark:#22a35d;
    --text:#eefff4;
    --muted:#7fa891;
    --danger:#ff8a65;
    --track:#1f3a28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 80% -10%, #16301f, var(--bg) 60%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    padding:16px;
  }
  .app{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border-radius:24px;
    padding:24px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    border:1px solid #1c3524;
    text-align:center;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
  }
  h1{
    margin:4px 0 20px;
    font-size:20px;
    font-weight:700;
  }
  .ring-wrap{
    position:relative;
    width:220px;
    height:220px;
    margin:0 auto 22px;
  }
  svg{
    transform:rotate(-90deg);
    width:100%;
    height:100%;
  }
  .ring-bg{
    fill:none;
    stroke:var(--track);
    stroke-width:14;
  }
  .ring-fg{
    fill:none;
    stroke:var(--accent);
    stroke-width:14;
    stroke-linecap:round;
    transition:stroke-dashoffset .35s ease;
  }
  .ring-center{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .ring-center .count{
    font-size:48px;
    font-weight:800;
    font-variant-numeric: tabular-nums;
  }
  .ring-center .unit{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .goal-note{
    font-size:12px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .btn{
    border:none;
    border-radius:16px;
    padding:16px 0;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:transform .08s, filter .15s;
  }
  .btn:active{ transform:scale(0.95); }
  .btn-plus{
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#06210f;
  }
  .btn-minus{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid #2a4a34;
  }
  .btn-reset{
    grid-column:1 / -1;
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:12px 0;
    font-size:14px;
    letter-spacing:1px;
  }
  .btn-reset:active{
    background:rgba(255,138,101,0.12);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="eyebrow">Exercício 2</div>
    <h1>Contador de Passos</h1>

    <div class="ring-wrap">
      <svg viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="96"></circle>
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="96"
                stroke-dasharray="603.19" stroke-dashoffset="603.19"></circle>
      </svg>
      <div class="ring-center">
        <div class="count" id="countValue">0</div>
        <div class="unit">passos</div>
      </div>
    </div>

    <div class="goal-note" id="goalNote">Meta diária: 10.000 passos</div>

    <div class="controls">
      <button class="btn btn-minus" id="minusBtn">−1</button>
      <button class="btn btn-plus" id="plusBtn">+1</button>
      <button class="btn btn-reset" id="resetBtn">RESETAR</button>
    </div>
  </div>

<script>
  const GOAL = 10000;
  const CIRC = 2 * Math.PI * 96;

  let count = 0;

  const countEl = document.getElementById('countValue');
  const ringFg = document.getElementById('ringFg');
  const goalNote = document.getElementById('goalNote');
  const plusBtn = document.getElementById('plusBtn');
  const minusBtn = document.getElementById('minusBtn');
  const resetBtn = document.getElementById('resetBtn');

  ringFg.style.strokeDasharray = CIRC.toFixed(2);

  function render(){
    countEl.textContent = count.toLocaleString('pt-BR');
    const pct = Math.min(count / GOAL, 1);
    const offset = CIRC * (1 - pct);
    ringFg.style.strokeDashoffset = offset.toFixed(2);

    if(count >= GOAL){
      goalNote.textContent = 'Meta batida! 🎉';
    } else {
      const restante = GOAL - count;
      goalNote.textContent = `Faltam ${restante.toLocaleString('pt-BR')} passos para a meta`;
    }
  }

  plusBtn.addEventListener('click', ()=>{
    count += 1;
    render();
  });

  minusBtn.addEventListener('click', ()=>{
    count = Math.max(0, count - 1);
    render();
  });

  resetBtn.addEventListener('click', ()=>{
    count = 0;
    render();
  });

  render();
</script>
</body>
</html>

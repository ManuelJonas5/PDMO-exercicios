<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A comprar</title>
    <link rel="stylesheet" href="stile.css">
</head>

<body>

    <div class="container">

        <h1>Lista de Compras</h1>

        <div class="formulario">
            <input
                type="text"
                id="itemInput"
                placeholder="Digite um item..."
            >

            <button id="adicionarBtn">Adicionar</button>
        </div>

        <h2>A comprar</h2>

        <ul id="listaComprar"></ul>

        <div class="acoes">

            <label class="selecionar-tudo">
                <input type="checkbox" id="selecionarTudo">
                <span class="check-tudo"></span>
                Tudo
            </label>

            <button id="continuarBtn" class="continuar">
                Continuar →
            </button>

        </div>

    </div>

    <script src="cript.js"></script>

</body>
</html>
